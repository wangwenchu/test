* { box-sizing: border-box; }
body { margin: 0; background: #fafafa; color: #1f2328;

.slides-stage { position: relative; height: calc(100vh - 52px); overflow: hidden; }

<script>
const SLIDES = ["\u003ch1>👋 欢迎来到 Tydora\u003c/h1>\n\u003cp>这里是一张白纸。📄\u003c/p>\n\u003cp>此刻，你正在读的这段文字，和你将来在这里写下的每一个字，都以最朴素的 Markdown 格式，安静地躺在你自己的电脑上。不上传，不锁定，十年后依然在。🔒\u003c/p>\n\u003cp>写作应该是一件简单的事：一个想法💡，一支笔✒️，一张不催促你的纸📄。Tydora 想做的就是这样一张纸。\u003c/p>\n","\u003ch2>✍️ 两种方式落笔\u003c/h2>\n\u003cp>按 \u003ccode>Ctrl+/\u003c/code>，感受一下：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>即时渲染模式\u003c/strong> ✨ —— 你现在看到的样子。\u003cstrong>加粗\u003c/strong>、\u003cem>斜体\u003c/em>、\u003ccode>代码\u003c/code>、==高亮==，随手可用，所见即所得。\u003c/li>\n\u003cli>\u003cstrong>源码模式\u003c/strong> ⌨️ —— 同一篇文字的素颜。纯粹的 Markdown 字符，适合喜欢敲符号的人。\u003c/li>\n\u003c/ul>\n\u003cp>你可以在任何时刻切换，文字不会丢。\u003c/p>\n","\u003ch2>🌱 一些值得一试的事\u003c/h2>\n\u003cul>\n\u003cli>🔗 用 \u003ccode>[[欢迎]]\u003c/code> 这样的双链，把想法连成一张网；再用关系图谱看看它们长成了什么形状。\u003c/li>\n\u003cli>🧠 按 \u003ccode>Ctrl+M\u003c/code>，让一篇笔记变成一张思维导图。\u003c/li>\n\u003cli>🧩 把卡片拖上白板，在无限画布上重新排列你的灵感。\u003c/li>\n\u003cli>🔍 按 \u003ccode>Ctrl+P\u003c/code> 呼出命令面板——忘记功能在哪里的时候，它总在那里。\u003c/li>\n\u003cli>💻 按 `Ctrl+`` 打开终端，写作与命令行只隔一个反引号。\u003c/li>\n\u003c/ul>\n","\u003ch2>📚 如果你想深入了解\u003c/h2>\n\u003cul>\n\u003cli>⌨️ 键盘流？看一眼 [[快捷键]]。\u003c/li>\n\u003cli>🎨 想换主题、调字体、开打字机模式？按 \u003ccode>Ctrl+,\u003c/code>，设置里都有。\u003c/li>\n\u003c/ul>\n\u003cp>就这些了。\u003c/p>\n\u003cp>现在，删掉这段话，或者留着它。\u003c/p>\n\u003cp>然后，写下你的第一行字。🚀\u003c/p>\n\u003cpre class=\"hljs\">\u003ccode class=\" language-c\">\u003cspan class=\"hljs-type\">int\u003c/span> a = \u003cspan class=\"hljs-number\">1\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>da\u003c/li>\n\u003c/ul>\n\u003col>\n\u003cli>dahh\u003c/li>\n\u003cli>da\u003c/li>\n\u003cli>das\u003c/li>\n\u003cli>da\u003c/li>\n\u003cli>\u003cstrong>都是都是\u003c/strong>单位看得开的打开你几号啊\u003c/li>\n\u003c/ol>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmi>α\u003c/mi>\u003cmo>±\u003c/mo>\u003cmi>β\u003c/mi>\u003c/mrow>\u003cannot let i = 0;
const stage = document.getElementById('stage');
const pageEl = document.getElementById('page');
const barEl = document.getElementById('bar');
function render() {
  stage.innerHTML = '<div class="slide active">' + SLIDES[i] + '</div>';
  pageEl.textContent = (i + 1) + ' / ' + SLIDES.length;
  barEl.style.width = ((i + 1) / SLIDES.length * 100) + '%';
  stage.scrollTop = 0;
}
function go(d) { i = Math.max(0, Math.min(SLIDES.length - 1, i + d)); render(); }
document.getElementById('prev').onclick = function () { go(-1); };
document.getElementById('next').onclick = function () { go(1); };
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') go(1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  else if (e.key === 'Home') { i = 0; render(); }
  else if (e.key === 'End') { i = SLIDES.length - 1; render(); }
  else if (e.key === 'Escape') window.close();
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
render();
